services:
  # =========================================================================
  # Serviço Principal: Plataforma iPLS (SJRR - Justiça Federal)
  # =========================================================================
  ipls-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipls-sjrr:latest
    container_name: ipls-sjrr-app
    restart: unless-stopped
    ports:
      # Porta no host (3100 por padrão, para não conflitar com outros sistemas na 3000)
      - "${IPLS_PORT:-3100}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # IA local compatível com a API da OpenAI (LM Studio, Ollama, vLLM)
      - AI_PROVIDER=${AI_PROVIDER:-}
      - LOCAL_AI_ENDPOINT=${LOCAL_AI_ENDPOINT:-}
      - LOCAL_AI_MODEL=${LOCAL_AI_MODEL:-}
      - LOCAL_AI_API_KEY=${LOCAL_AI_API_KEY:-}
      - LOCAL_AI_TEMPERATURE=${LOCAL_AI_TEMPERATURE:-}
      - LOCAL_AI_MAX_TOKENS=${LOCAL_AI_MAX_TOKENS:-}
      - LOCAL_AI_TIMEOUT_S=${LOCAL_AI_TIMEOUT_S:-}
      - LOCAL_AI_REPORT_TIMEOUT_S=${LOCAL_AI_REPORT_TIMEOUT_S:-}
      - LOCAL_AI_CONTEXT_TOKENS=${LOCAL_AI_CONTEXT_TOKENS:-}
      - AI_AGENT=${AI_AGENT:-}
      - AI_AGENT_MAX_STEPS=${AI_AGENT_MAX_STEPS:-}
      - AI_VISION=${AI_VISION:-}
      - MCP_TOKENS=${MCP_TOKENS:-}
      - MCP_RATE_PER_MIN=${MCP_RATE_PER_MIN:-}
      - SEI_MODE=${SEI_MODE:-}
      - SEI_URL=${SEI_URL:-}
      - SEI_SIGLA_SISTEMA=${SEI_SIGLA_SISTEMA:-}
      - SEI_CHAVE=${SEI_CHAVE:-}
      - SEI_ID_UNIDADE=${SEI_ID_UNIDADE:-}
      - SEI_OP_LISTAR=${SEI_OP_LISTAR:-}
      - SEI_OP_DOCUMENTO=${SEI_OP_DOCUMENTO:-}
      - SEI_SOAP_ACTION=${SEI_SOAP_ACTION:-}
      - SEI_TIMEOUT_S=${SEI_TIMEOUT_S:-}
      - SEI_SYNC_HOUR=${SEI_SYNC_HOUR:-}
      - SEI_MAX_DOCS_POR_EXECUCAO=${SEI_MAX_DOCS_POR_EXECUCAO:-}
      - SEI_SOMENTE_PUBLICOS=${SEI_SOMENTE_PUBLICOS:-}
      - SEI_SIMULADO_DIR=${SEI_SIMULADO_DIR:-}
      - SEI_ALLOW_SIMULADO_IN_PRODUCTION=${SEI_ALLOW_SIMULADO_IN_PRODUCTION:-}
      # Viagens a serviço: painel de BI (Power BI, "Publicar na Web")
      - TRAVEL_BI_URL=${TRAVEL_BI_URL:-}
      - TRAVEL_BI_API_HOST=${TRAVEL_BI_API_HOST:-}
      - TRAVEL_BI_SYNC_HOUR=${TRAVEL_BI_SYNC_HOUR:-}
      # Persistência em PostgreSQL (schema "ipls"). Na primeira subida, com o banco
      # vazio, a base é importada de data/database.json.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ipls_admin}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-ipls_db}
      # Autenticação no AD (ver .env.example)
      - AUTH_MODE=${AUTH_MODE:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_HOURS=${SESSION_HOURS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - AUTH_DEFAULT_DOMAIN=${AUTH_DEFAULT_DOMAIN:-}
      - AUTH_DOMAIN_SUFFIX=${AUTH_DOMAIN_SUFFIX:-}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - IPLS_ADMINS=${IPLS_ADMINS:-}
      - IPLS_DEVS=${IPLS_DEVS:-}
      - AUTH_MAX_FAILURES=${AUTH_MAX_FAILURES:-}
      - AUTH_MAX_FAILURES_IP=${AUTH_MAX_FAILURES_IP:-}
      - LDAP_TLS_CA_FILE=${LDAP_TLS_CA_FILE:-}
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-}
      - AUTH_DEV_PASSWORD=${AUTH_DEV_PASSWORD:-}
      - AUTH_ALLOW_DEV_IN_PRODUCTION=${AUTH_ALLOW_DEV_IN_PRODUCTION:-}
    volumes:
      # Fonte da importação inicial (data/database.json) e arquivos de carga
      - ./data:/app/data
      # Certificados da AC interna (ex.: AC Raiz TRF1) para o LDAPS
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ipls-network
    depends_on:
      postgres:
        condition: service_healthy
      local-ai:
        condition: service_started
        required: false

  # =========================================================================
  # Serviço de Banco de Dados Relacional (PostgreSQL 16)
  # Padrão Corporativo para Tribunais e Datacenters (TRF1 / CNJ)
  # As tabelas (schema "ipls") são criadas pela própria aplicação na inicialização.
  # Exposto só em 127.0.0.1, na porta 5433 por padrão (a 5432 pode estar em uso).
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ipls-sjrr-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IPLS_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipls_db}
      POSTGRES_USER: ${POSTGRES_USER:-ipls_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - ipls_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipls_admin} -d ${POSTGRES_DB:-ipls_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ipls-network

  # =========================================================================
  # Serviço Opcional de IA Local (On-Premise para dependências da SJRR)
  # Permite inferência 100% offline via Ollama na rede interna do Tribunal
  # Ative com: docker compose --profile local-ai up -d
  # =========================================================================
  local-ai:
    image: ollama/ollama:latest
    container_name: ipls-sjrr-ollama
    restart: unless-stopped
    profiles:
      - local-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
    networks:
      - ipls-network

networks:
  ipls-network:
    driver: bridge
    name: ipls-network

volumes:
  ipls_pgdata:
    name: ipls_pgdata
  ollama_models:
    name: ipls_ollama_models
