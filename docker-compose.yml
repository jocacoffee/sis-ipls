services:
  # =========================================================================
  # Serviço Principal: Plataforma iPLS (SJRR - Justiça Federal)
  # =========================================================================
  ipls-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipls-sjrr:latest
    container_name: ipls-sjrr-app
    restart: unless-stopped
    ports:
      # Porta no host (3100 por padrão, para não conflitar com outros sistemas na 3000)
      - "${IPLS_PORT:-3100}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Persistência em PostgreSQL (schema "ipls"). Na primeira subida, com o banco
      # vazio, a base é importada de data/database.json.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ipls_admin}:${POSTGRES_PASSWORD:-<senha-do-banco>}@postgres:5432/${POSTGRES_DB:-ipls_db}
      # Autenticação no AD (ver .env.example)
      - AUTH_MODE=${AUTH_MODE:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_HOURS=${SESSION_HOURS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - AUTH_DEFAULT_DOMAIN=${AUTH_DEFAULT_DOMAIN:-}
      - AUTH_DOMAIN_SUFFIX=${AUTH_DOMAIN_SUFFIX:-}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_GROUP_ADMIN_DN=${LDAP_GROUP_ADMIN_DN:-}
      - LDAP_GROUP_GESTORES_DN=${LDAP_GROUP_GESTORES_DN:-}
      - LDAP_TLS_CA_FILE=${LDAP_TLS_CA_FILE:-}
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-}
      - AUTH_DEV_PASSWORD=${AUTH_DEV_PASSWORD:-}
      - AUTH_ALLOW_DEV_IN_PRODUCTION=${AUTH_ALLOW_DEV_IN_PRODUCTION:-}
    volumes:
      # Fonte da importação inicial (data/database.json) e arquivos de carga
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ipls-network
    depends_on:
      postgres:
        condition: service_healthy
      local-ai:
        condition: service_started
        required: false

  # =========================================================================
  # Serviço de Banco de Dados Relacional (PostgreSQL 16)
  # Padrão Corporativo para Tribunais e Datacenters (TRF1 / CNJ)
  # As tabelas (schema "ipls") são criadas pela própria aplicação na inicialização.
  # Exposto só em 127.0.0.1, na porta 5433 por padrão (a 5432 pode estar em uso).
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ipls-sjrr-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IPLS_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipls_db}
      POSTGRES_USER: ${POSTGRES_USER:-ipls_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<senha-do-banco>}
    volumes:
      - ipls_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipls_admin} -d ${POSTGRES_DB:-ipls_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ipls-network

  # =========================================================================
  # Serviço Opcional de IA Local (On-Premise para dependências da SJRR)
  # Permite inferência 100% offline via Ollama na rede interna do Tribunal
  # Ative com: docker compose --profile local-ai up -d
  # =========================================================================
  local-ai:
    image: ollama/ollama:latest
    container_name: ipls-sjrr-ollama
    restart: unless-stopped
    profiles:
      - local-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
    networks:
      - ipls-network

networks:
  ipls-network:
    driver: bridge
    name: ipls-network

volumes:
  ipls_pgdata:
    name: ipls_pgdata
  ollama_models:
    name: ipls_ollama_models
